<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anadolu BiyoMiras Atlası</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --wine: #520d25;
  --gold: #eac45b;
  --cream: #fff9e9;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: var(--wine);
  color: var(--cream);
}
header {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 24px;
  background: #41091d;
  border-bottom: 2px solid var(--gold);
}
h1 {
  font-size: clamp(17px, 2vw, 25px);
  margin: 0;
  color: var(--gold);
}
small { color: #e9d7c1; }
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
input, select, button {
  padding: 11px;
  border-radius: 8px;
  border: 1px solid #cfa75a;
  font: inherit;
}
input { min-width: 180px; }
button {
  background: var(--gold);
  color: #3a1020;
  cursor: pointer;
  font-weight: 700;
}
button:hover { filter: brightness(1.08); }
.app {
  display: flex;
  height: calc(100dvh - 76px);
}
aside {
  width: 42%;
  max-width: 560px;
  overflow: auto;
  background: #4a1027;
  border-right: 2px solid var(--gold);
  padding: 24px;
  flex-shrink: 0;
}
aside.hidden { display: none; }
#map {
  flex: 1;
  min-width: 0;
  background: #f1e7ce;
}
h2 {
  color: var(--gold);
  margin: 10px 0;
}
.status {
  display: inline-block;
  border: 1px solid var(--gold);
  padding: 6px 10px;
  border-radius: 20px;
  color: var(--gold);
}
.model {
  height: 260px;
  border: 1px dashed #b58c64;
  border-radius: 12px;
  display: grid;
  place-items: center;
  text-align: center;
  margin: 16px 0;
  padding: 20px;
  background: #381020;
}
.meta { line-height: 1.65; }
.note {
  font-size: 13px;
  color: #e7cdb5;
}
.sources a {
  color: #ffe08b;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.sources li { margin: 8px 0; }
.close { float: right; }
.legend {
  position: absolute;
  bottom: 20px;
  right: 14px;
  z-index: 500;
  background: #fffdf3;
  color: #331520;
  border-radius: 8px;
  padding: 10px;
  box-shadow: 0 2px 10px #0003;
  font-size: 12px;
}
.dot {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  margin-right: 5px;
}
.leaflet-container {
  font: inherit;
  background: #f1e7ce !important;
}
@media (max-width: 760px) {
  header {
    height: auto;
    min-height: 100px;
    align-items: flex-start;
    flex-direction: column;
    padding: 12px;
  }
  .app { height: calc(100dvh - 122px); }
  aside { width: 55%; padding: 12px; }
  .controls { width: 100%; }
  input { min-width: 100px; width: 48%; }
  select { max-width: 45%; }
  .model { height: 180px; }
}
@media (max-width: 480px) {
  .app { position: relative; }
  aside {
    position: absolute;
    z-index: 600;
    left: 0;
    top: 0;
    bottom: 0;
    width: 88%;
    box-shadow: 4px 0 20px #0006;
  }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>ANADOLU | BiyoMiras Atlası</h1>
    <small>Nesli tükenmiş, tehdit altındaki ve endemik türlerin coğrafi atlası</small>
  </div>
  <div class="controls">
    <select id="filter" aria-label="Tür filtresi">
      <option value="all">Tüm türler</option>
      <option value="animal">Hayvanlar</option>
      <option value="plant">Bitkiler</option>
    </select>
    <input id="search" placeholder="Tür ara..." aria-label="Tür ara">
    <button id="searchBtn">Ara</button>
    <button id="panelBtn">Bilgi paneli</button>
  </div>
</header>

<div class="app">
  <aside id="panel" class="hidden">
    <button class="close" id="closeBtn">✕ Kapat</button>
    <div id="details">
      <h2>Bir tür seçin</h2>
    </div>
  </aside>
  <div id="map"></div>
</div>

<div class="legend">
  <strong>Türkiye · WGS84</strong>
  <hr>
  <div><i class="dot" style="background:#d62828"></i>Coğrafi konum</div>
  <div><i class="dot" style="background:#f0c419"></i>Seçili</div>
  <div><i class="dot" style="background:#ff8c21"></i>Arama sonucu</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// HARİTA
const map = L.map("map", {
  zoomControl: true
}).setView([39,35],6);

const base = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap contributors",
    maxZoom: 19,
    crossOrigin: true
  }
).addTo(map);

// Harita altlığı yüklenemezse uyarı
let tileErrors = 0;
let noticeShown = false;

const mapNotice = L.control({position:"bottomleft"});
mapNotice.onAdd = function() {
  const el = L.DomUtil.create("div");
  el.style.cssText =
    "background:#fff9e9;color:#520d25;padding:8px 12px;" +
    "border:1px solid #520d25;border-radius:8px;" +
    "max-width:290px;font:13px system-ui;" +
    "box-shadow:0 2px 10px #0003";
  el.textContent =
    "Harita altlığı yüklenemedi. İnternet bağlantısını " +
    "veya harita sunucusuna erişimi kontrol edin.";
  return el;
};

base.on("tileerror", () => {
  tileErrors++;
  if (tileErrors >= 5 && !noticeShown) {
    noticeShown = true;
    mapNotice.addTo(map);
  }
});

base.on("tileload", () => {
  if (noticeShown) {
    map.removeControl(mapNotice);
    noticeShown = false;
    tileErrors = 0;
  }
});

// Yaklaşık Türkiye silueti resmî sınır verisi değil buraya koymamız lazım!!!

L.polygon(outline, {
  color: "#78142e",
  weight: 3,
  fillColor: "#eac45b",
  fillOpacity: 0.12,
  interactive: false
}).addTo(map);

// PANEL VE İŞARETLER
const panel = document.getElementById("panel");
const details = document.getElementById("details");
const search = document.getElementById("search");
const filter = document.getElementById("filter");

let selected = null;
let matched = new Set();
let markers = [];

function normalize(s) {
  return s.toLocaleLowerCase("tr-TR")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ı/g,"i");
}

function openPanel() {
  panel.classList.remove("hidden");
  setTimeout(() => map.invalidateSize(), 120);
}

function closePanel() {
  panel.classList.add("hidden");
  selected = null;
  matched.clear();
  render();
  setTimeout(() => map.invalidateSize(), 120);
}

function choose(s) {
  selected = s.id;
  openPanel();

  const sources = s.sources.map(([label,url]) =>
    `<li><a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a></li>`
  ).join("");

  details.innerHTML = `
    <h2>${s.name}</h2>
    <p><em>${s.latin}</em></p>
    <p class="status">${s.status}</p>

    <div class="model">
      <div>
        <strong>3D model alanı</strong>
        <p>Doğrulanmış, lisanslı GLB model eklendiğinde
        burada döndürülerek incelenebilecek.</p>
      </div>
    </div>

    <div class="meta">
      <b>Grup:</b> ${s.type === "animal" ? "Hayvan" : "Bitki"}<br>
      <b>Haritada gösterilen bölge:</b> ${s.regions.join(", ")}
      <p>${s.description}</p>
    </div>

    <h3 style="color:var(--gold)">Kaynaklar ve orijinal bağlantılar</h3>
    <ul class="sources">${sources}</ul>

    <p class="note">
      ⚑ Haritadaki koordinatlar WGS84 sistemindedir;
      yaklaşık bölgesel işaretlerdir. Doğrulanmış
      gözlem noktaları olarak kullanılmamalıdır.
    </p>
  `;

  render();
}

function render() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const f = filter.value;

  species
    .filter(s => f === "all" || s.type === f)
    .forEach(s => {
      s.points.forEach((p,i) => {
        const color =
          selected === s.id ? "#f0c419" :
          matched.has(s.id) ? "#ff8c21" :
          "#d62828";

        const marker = L.circleMarker(p, {
          radius: 9,
          color: "#fff",
          weight: 2,
          fillColor: color,
          fillOpacity: 0.95
        }).addTo(map);

        marker.bindTooltip(
          s.name + " — " +
          s.regions[Math.min(i,s.regions.length-1)]
        );

        marker.on("click", () => choose(s));
        markers.push(marker);
      });
    });
}

function doSearch() {
  const q = normalize(search.value.trim());

  matched = new Set(
    q ? species
      .filter(s => normalize(s.name + " " + s.latin).includes(q))
      .map(s => s.id) : []
  );

  const found = species.find(s =>
    matched.has(s.id) &&
    (filter.value === "all" || filter.value === s.type)
  );

  if (found) {
    choose(found);

    const pts = species
      .filter(s => matched.has(s.id))
      .flatMap(s => s.points);

    map.fitBounds(L.latLngBounds(pts).pad(0.35), {
      maxZoom: 8
    });
  } else {
    selected = null;

    if (q) {
      openPanel();
      details.innerHTML =
        "<h2>Sonuç bulunamadı</h2>" +
        "<p>Başka bir tür adı deneyin.</p>";
    }

    render();
  }
}

// BUTONLAR
document.getElementById("searchBtn").onclick = doSearch;

search.addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

search.addEventListener("input", () => {
  if (!search.value.trim()) {
    matched.clear();
    render();
  }
});

filter.onchange = () => render();

document.getElementById("panelBtn").onclick = () => {
  if (panel.classList.contains("hidden")) {
    if (selected) {
      openPanel();
    } else {
      details.innerHTML =
        "<h2>Bir tür seçin</h2>" +
        "<p>Haritadaki noktalardan birine tıklayın.</p>";
      openPanel();
    }
  } else {
    closePanel();
  }
};

document.getElementById("closeBtn").onclick = closePanel;

render();

map.fitBounds(
  [[35.7,25.6],[42.2,44.9]],
  {padding:[15,15]}
);

</script>
</body>
</html>
